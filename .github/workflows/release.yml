name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: cargo publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Verify release tag matches Cargo.toml version
        run: |
          set -euo pipefail
          manifest_version=$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml version ($manifest_version) does not match release tag ($tag)"
            exit 1
          fi
          echo "Publishing threencr v$manifest_version"

      - name: cargo test
        run: cargo test --verbose

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
