name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: cargo publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Verify release tag matches Cargo.toml version
        run: |
          set -euo pipefail
          manifest_version=$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml version ($manifest_version) does not match release tag ($tag)"
            exit 1
          fi
          echo "Publishing threencr v$manifest_version"

      - name: cargo test
        run: cargo test --verbose

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
