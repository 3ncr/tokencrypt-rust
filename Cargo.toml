[package]
name = "threencr"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Rust implementation of the 3ncr.org v1 string encryption standard (AES-256-GCM)."
license = "MIT"
repository = "https://github.com/3ncr/tokencrypt-rust"
homepage = "https://3ncr.org/"
documentation = "https://docs.rs/threencr"
readme = "README.md"
keywords = ["3ncr", "encryption", "aes-gcm", "argon2id", "tokens"]
categories = ["cryptography"]

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom"] }
sha3 = { version = "0.12", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
getrandom = "0.4"
